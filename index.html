<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utah Permit Prep</title>
<meta name="theme-color" content="#0b5d3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Permit Prep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#eef0ee; --card:#ffffff; --text:#1c2220; --muted:#5a6560; --line:#d6dbd8;
  --sign:#0b5d3b; --sign-text:#ffffff; --yellow:#f6c400; --yellow-text:#1c1a10;
  --good:#17703a; --good-bg:#e1f3e7; --bad:#b3261e; --bad-bg:#fbe7e5;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --card:#1e2421; --text:#eef2ef; --muted:#a2aea7; --line:#333d38;
    --sign:#0e7048; --sign-text:#ffffff; --yellow:#f6c400; --yellow-text:#1c1a10;
    --good:#6fd394; --good-bg:#17301f; --bad:#ff9a92; --bad-bg:#3a1c1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141816; --card:#1e2421; --text:#eef2ef; --muted:#a2aea7; --line:#333d38;
  --sign:#0e7048; --sign-text:#ffffff; --yellow:#f6c400; --yellow-text:#1c1a10;
  --good:#6fd394; --good-bg:#17301f; --bad:#ff9a92; --bad-bg:#3a1c1a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:18px; line-height:1.45; -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
h1,h2,.display{font-family:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}

/* Highway guide sign header */
.sign{
  background:var(--sign); color:var(--sign-text);
  border:3px solid #fff; outline:3px solid var(--sign);
  border-radius:12px; padding:16px 18px 18px; margin:6px 3px 18px;
}
.sign h1{font-size:40px;line-height:1.02}
.sign p{margin:6px 0 0;font-size:17px;opacity:.95}
.sign .best{margin-top:12px;font-weight:600;font-size:16px}

h2{font-size:26px;margin:22px 0 10px}
.btn{
  display:block;width:100%;text-align:left;cursor:pointer;
  font:inherit;color:var(--text);background:var(--card);
  border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 10px;
  min-height:56px; -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.99)}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn .t{font-weight:600;font-size:19px;display:block}
.btn .s{color:var(--muted);font-size:15px;display:block;margin-top:1px}
.primary{background:var(--yellow);color:var(--yellow-text);border-color:var(--yellow)}
.primary .s{color:var(--yellow-text);opacity:.8}
.center{text-align:center}
.lbl{font-weight:600;margin:0 0 8px}
.chips{display:flex;gap:6px;margin:0 0 6px}
.chip{flex:1;min-width:0;min-height:52px;padding:0 2px;font:inherit;font-weight:600;font-size:18px;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:var(--sign-text)}
.chip:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hint{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.note{color:var(--muted);font-size:14.5px;margin-top:22px}

/* Quiz */
.topbar{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--muted);font-size:16px;margin-bottom:8px}
.quit{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;padding:8px 0;cursor:pointer}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--sign);border-radius:99px;transition:width .25s}
.cat{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:4px}
.q{font-family:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;font-weight:600;font-size:28px;line-height:1.15;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:15px;margin-top:1px}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right .l{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.explain{background:var(--card);border-left:6px solid var(--sign);border-radius:8px;padding:12px 14px;margin:14px 0;font-size:17px}
.explain b{display:block;margin-bottom:2px}
.explain.no{border-left-color:var(--bad)}
.explain.yes{border-left-color:var(--good)}

/* Results */
.score{font-family:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;font-size:84px;line-height:1;margin:10px 0 0}
.verdict{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:600;margin:10px 0 18px}
.verdict.pass{background:var(--good-bg);color:var(--good)}
.verdict.fail{background:var(--bad-bg);color:var(--bad)}
.miss{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.miss .mq{font-weight:600}
.miss .ma{color:var(--good);margin-top:4px;font-size:16px}
.miss .me{color:var(--muted);margin-top:4px;font-size:15.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---------- Question bank ----------
var Q = [
 // ----- Alcohol and laws (Handbook Section 10) -----
 {c:"Alcohol and laws", q:"What is the legal blood alcohol limit (BAC) for drivers 21 and older in Utah?", o:["0.02%","0.05%","0.08%","0.10%"], a:1, e:"You violate the law if you are over 0.05 BAC. You can also be charged if you are too impaired to drive safely, even under the limit."},
 {c:"Alcohol and laws", q:"A driver under 21 in Utah is subject to which alcohol rule?", o:["The same 0.05% limit as adults","0.02% is allowed","Zero tolerance: any measurable alcohol","Alcohol is fine with a licensed adult in the car"], a:2, e:"Under 21, any measurable amount of alcohol is a violation (the Not-a-Drop Act)."},
 {c:"Alcohol and laws", q:"A driver under 21 is caught with any measurable alcohol in their body. For a first offense, all driving privileges are denied for:", o:["30 days","3 months","6 months","1 year"], a:2, e:"Under the Not-a-Drop Act, a first offense means driving privileges are denied for six months."},
 {c:"Alcohol and laws", q:"By driving in Utah, you have agreed (implied consent) to:", o:["Random vehicle searches","A chemical test of your breath, blood, urine, or oral fluids if an officer asks","Speed camera tickets only","Nothing, because tests are always optional"], a:1, e:"This is the implied consent law. You must take the test the officer selects."},
 {c:"Alcohol and laws", q:"A driver 21 or older refuses a chemical test after a DUI arrest. For a first refusal the license is revoked for:", o:["6 months","12 months","18 months","5 years"], a:2, e:"A first refusal means 18 months of revocation. A second or later refusal means 36 months."},
 {c:"Alcohol and laws", q:"On a first DUI conviction for a driver 21 or older, the license is suspended for:", o:["30 days","60 days","120 days","1 year"], a:2, e:"The handbook lists a 120-day suspension for a first DUI and two years for a second or later offense."},
 {c:"Alcohol and laws", q:"A person aged 13 to 20 is convicted in court of possessing or drinking alcohol. For a first offense the driver license is suspended for:", o:["30 days","6 months","1 year","2 years"], a:2, e:"The court suspends the license for one year for a first offense and two years for a second or later offense."},
 {c:"Alcohol and laws", q:"At what blood alcohol level does alcohol start to affect your vision?", o:["0.02","0.05","0.08","0.15"], a:0, e:"Vision is affected at 0.02 BAC for all drivers."},
 {c:"Alcohol and laws", q:"When does driving impairment from alcohol begin?", o:["After the third drink","Only at 0.08 BAC","With the first drink","Only when you feel drunk"], a:2, e:"Impairment starts with the first drink. Even one drink can affect your ability to drive."},
 {c:"Alcohol and laws", q:"Which kinds of drugs can make driving dangerous?", o:["Only illegal drugs","Only prescription drugs","Illegal, over-the-counter, and prescribed drugs","Only drugs taken with alcohol"], a:2, e:"Illegal, over-the-counter, and prescribed drugs can all affect reflexes, judgment, vision, and alertness."},
 {c:"Alcohol and laws", q:"What does an ignition interlock device do?", o:["Locks the doors while driving","Requires a breath alcohol sample to start and operate the vehicle","Limits the vehicle's top speed","Records the driver's phone use"], a:1, e:"An ignition interlock device continuously monitors and requires a breath sample to start and operate the vehicle."},
 {c:"Alcohol and laws", q:"You are angry or very worried before a drive. What does the handbook advise?", o:["Drive fast to burn off the stress","Give yourself time to cool off and stay off the road until it passes","Turn up the music and keep your eyes on the road","Drive only on the freeway"], a:1, e:"Strong emotions interfere with thinking and attention. Cool off, or have someone else drive."},

 // ----- Permit and license rules (Handbook Sections 2, 3, 6) -----
 {c:"Permit and license rules", q:"What is the minimum age to get an entry-level learner permit in Utah?", o:["14","15","16","17"], a:1, e:"You must be at least 15."},
 {c:"Permit and license rules", q:"How long is an entry-level learner permit valid?", o:["6 months","12 months","18 months","3 years"], a:2, e:"The entry-level learner permit and its written test score are valid for 18 months."},
 {c:"Permit and license rules", q:"If you are 15 to 18, how much driving with a parent or legal guardian is required as part of driver education?", o:["20 hours, 5 after sunset","30 hours, 5 after sunset","40 hours, 10 after sunset","50 hours, 15 after sunset"], a:2, e:"Students must complete 40 hours of driving, 10 of them after sunset, with a parent or legal guardian."},
 {c:"Permit and license rules", q:"If you are 16 or 17, how long must you hold a learner permit before you can get your first regular license?", o:["30 days","3 months","6 months","1 year"], a:2, e:"At 16 or 17 the holding period is 6 months. You must also complete driver education. This is about getting the license, not about taking the driving test."},
 {c:"Permit and license rules", q:"Which person may sit next to a permit holder under 18 as the supervising driver?", o:["Any friend with a driver license","A licensed parent, stepparent, or foster parent","A licensed driver who is 18","No one is needed in daylight"], a:1, e:"The supervisor must be a licensed parent, stepparent, foster parent, or legal guardian, an approved driving instructor, or (in set cases) a responsible adult 21 or older."},
 {c:"Permit and license rules", q:"You are driving on a learner permit. Where must the permit be?", o:["At home","In your immediate possession","Only in the glove box","It does not need to be with you"], a:1, e:"The learner permit must be in your immediate possession whenever you drive."},
 {c:"Permit and license rules", q:"What score do you need to pass the written knowledge test?", o:["60%","70%","80% or better","100%"], a:2, e:"You must pass the written knowledge test with a score of 80% or better."},
 {c:"Permit and license rules", q:"The written test fee covers no more than how many attempts within 12 months?", o:["1","2","3","6"], a:2, e:"After three failed attempts you pay another fee for three more."},
 {c:"Permit and license rules", q:"How many hours of behind-the-wheel instruction does required driver education include?", o:["2","4","6","10"], a:2, e:"Required driver education includes 6 hours behind the wheel plus classroom or approved online instruction."},
 {c:"Permit and license rules", q:"What is the minimum age to take the driving skills test at a Driver License Division office?", o:["15","16","17","18"], a:1, e:"You must be at least 16 at the DLD. With a third-party tester or high school the minimum is 15."},
 {c:"Permit and license rules", q:"First-time license applicants must also pass the Traffic Safety and Trends Exam. What score is required?", o:["70%","80%","90%","100%"], a:3, e:"This extra exam requires a 100% score, and you can retake it as often as needed."},
 {c:"Permit and license rules", q:"Who may be in the car during the driving skills test?", o:["You, the examiner, and a parent","You and the examiner only","You, the examiner, and one friend","Anyone you choose"], a:1, e:"Only the applicant and the examiner are allowed in the vehicle."},
 {c:"Permit and license rules", q:"Which of these causes an automatic failure on the driving skills test?", o:["Signaling for two seconds before a turn","Failing to yield to a pedestrian","Checking your mirrors often","Using a head check before a lane change"], a:1, e:"Not yielding to pedestrians or other road users is an automatic failure. So are crashes, unsafe acts, and moving violations."},
 {c:"Permit and license rules", q:"Whenever you drive, proof of insurance must be:", o:["Mailed to the DMV each month","In the vehicle and shown to an officer who asks","Kept at home only","Needed only after a crash"], a:1, e:"Proof of insurance must be in the vehicle. You can show it electronically on a mobile device."},

 // ----- Signs and signals (Handbook Section 9) -----
 {c:"Signs and signals", q:"What should you do at a flashing red light?", o:["Slow down and proceed","Stop and look both ways before entering the intersection","Speed up to clear the intersection","Yield only if cars are coming"], a:1, e:"A flashing red light requires a complete stop, just like a stop sign."},
 {c:"Signs and signals", q:"What does a flashing yellow traffic light mean?", o:["Stop completely","The road is closed","Slow down and proceed with caution, ready to stop","Traffic from the other way must stop"], a:2, e:"Slow down and proceed with caution. Be prepared to stop for any traffic."},
 {c:"Signs and signals", q:"What does a steady yellow traffic light mean?", o:["Speed up","The light is about to change to red","Stop only if you are first in line","The signal is broken"], a:1, e:"A yellow light means the light is about to change to red."},
 {c:"Signs and signals", q:"Warning signs are usually what shape and color?", o:["Round and red","Square and green","Diamond-shaped and yellow","Rectangular and white"], a:2, e:"Warning signs are usually yellow diamonds with black lettering or symbols."},
 {c:"Signs and signals", q:"Work zone signs have what color background?", o:["Orange","Blue","White","Brown"], a:0, e:"Work zone signs are orange with black letters or symbols."},
 {c:"Signs and signals", q:"Guide signs (for roads, towns, and services) are square or rectangular and what colors?", o:["Red, white, or black","Green, brown, or blue","Orange or yellow","Only white"], a:1, e:"Guide signs are green, brown, or blue."},
 {c:"Signs and signals", q:"Regulatory signs that tell you about speed, turning, and parking are mostly what color?", o:["Yellow with black","Orange with black","White with black, red, or green","Blue with white"], a:2, e:"Regulatory signs are white with black, red, or green letters or symbols."},
 {c:"Signs and signals", q:"A traffic sign shows a symbol inside a red circle with a red slash across it. This means:", o:["You may do it carefully","You cannot do what the symbol shows","It is only a suggestion","Do it only at night"], a:1, e:"A red circle with a slash means you cannot do that thing."},
 {c:"Signs and signals", q:"What does a yield sign mean?", o:["Stop for 3 seconds","Slow down and yield to traffic that has the right-of-way","Speed up and merge","Traffic ahead is one-way"], a:1, e:"Slow down and yield to traffic that has the right-of-way."},
 {c:"Signs and signals", q:"On a two-way road, a solid yellow line on your side of the center line means:", o:["You may pass if the road is clear","You may not pass","The lane is for turning only","Passing is allowed with a signal"], a:1, e:"Passing is permitted only when the dashed line is on your side. A solid line on your side means no passing."},
 {c:"Signs and signals", q:"You are at a red light and want to turn right. You may turn:", o:["Without stopping if the road is empty","After a complete stop, unless a sign says otherwise","Only if you honk first","Never, because red means stop"], a:1, e:"You may turn right on red after coming to a complete stop unless posted otherwise."},
 {c:"Signs and signals", q:"A red arrow for a left turn means:", o:["Turn left carefully","Left turns are prohibited. Stop and remain stopped until a signal to proceed","Left turns are allowed after yielding","Go straight only"], a:1, e:"A red arrow prohibits that turn. Stay stopped until you get an indication to proceed."},
 {c:"Signs and signals", q:"A green arrow light means vehicles may:", o:["Go in any direction","Go only in the direction of the arrow, after yielding to vehicles and pedestrians still in the intersection","Stop and wait","Go faster"], a:1, e:"Proceed only in the direction of the arrow, after yielding to those still in the intersection."},
 {c:"Signs and signals", q:"The traffic lights at an intersection are not working. You must:", o:["Go through quickly","Come to a complete stop and yield to any vehicle on the right","Follow the car ahead","Honk and proceed"], a:1, e:"Stop completely before entering the intersection and yield to the vehicle on your right, unless an officer directs otherwise."},
 {c:"Signs and signals", q:"The light is green, but a police officer at the intersection signals you to stop. You should:", o:["Go because the light is green","Stop and obey the officer","Slow down and go around","Honk"], a:1, e:"Always obey a police officer over the traffic lights."},
 {c:"Signs and signals", q:"A round yellow sign with an X and the letters RR means:", o:["Road repair ahead","Slow down, look, and listen. A railroad crossing is ahead and you may need to stop","Right lane ends","Rest area"], a:1, e:"This advance warning sign tells you to slow down, look and listen, and be prepared to stop."},
 {c:"Signs and signals", q:"On an overhead lane signal in a flex lane, a red X means:", o:["You can use the lane","You cannot use the lane","Slow down","The lane is for buses"], a:1, e:"A green arrow means you can use the lane. A red X means you cannot."},
 {c:"Signs and signals", q:"The area between the solid white lines of a lane and an entry or exit lane is called the gore area. You should:", o:["Use it to pass","Never cross over or drive in it","Drive in it to merge early","Park in it in an emergency"], a:1, e:"It is against the law to cross or drive in the gore area."},

 // ----- Right of way (Handbook Sections 8, 9, 14) -----
 {c:"Right of way", q:"Two cars reach a four-way stop at the same time. Who goes first?", o:["The faster car","The car on the left","The car on the right","The larger vehicle"], a:2, e:"When you arrive at the same time, yield to the driver on your right."},
 {c:"Right of way", q:"You are turning left at a green light (no arrow). You must:", o:["Go first because you have the green","Yield to drivers in the opposite lane","Stop and wait for an arrow","Speed up before oncoming cars arrive"], a:1, e:"When making a left turn, yield the right-of-way to drivers in the opposite lane."},
 {c:"Right of way", q:"You are entering a public road from a driveway. You must:", o:["Go first, since you are already moving","Yield to drivers on the public road","Honk and go","Enter only at night"], a:1, e:"Yield to drivers on a public road when you are coming from a driveway or private road."},
 {c:"Right of way", q:"You are on an entrance ramp to an interstate. You must yield to:", o:["No one","Drivers already on the interstate","Only trucks","Only drivers in the left lane"], a:1, e:"Yield the right-of-way to drivers already on the interstate."},
 {c:"Right of way", q:"A pedestrian is in a crosswalk in front of you. You must:", o:["Honk and go around","Stop and yield until they have crossed","Slow down and keep going","Go if they are on the other half of the road"], a:1, e:"You must yield to pedestrians entering or in a crosswalk, even an unmarked one."},
 {c:"Right of way", q:"A pedestrian is crossing with a white cane or a guide dog. You must:", o:["Slow down and pass","Come to a complete stop","Honk to warn them","Go if you have a green light"], a:1, e:"Always yield to the visually impaired. You must come to a complete stop, even on green."},
 {c:"Right of way", q:"A car ahead is stopped at a crosswalk. You should:", o:["Pass it on the left","Never pass it. Someone you cannot see may be crossing","Pass if the road is clear","Honk and pass"], a:1, e:"Never pass vehicles stopped at a crosswalk. There may be people crossing that you can't see."},
 {c:"Right of way", q:"Which way does traffic flow in a roundabout, and what should you do as you approach?", o:["Clockwise. Speed up to merge","Counterclockwise. Slow down, yield, and enter when it is clear","Counterclockwise. Stop in the middle","Either way. Choose the shortest path"], a:1, e:"A roundabout flows counterclockwise. Slow down, yield to traffic and pedestrians, and enter when it is clear."},
 {c:"Right of way", q:"An emergency vehicle with a siren and flashing lights approaches. You must:", o:["Speed up","Drive at once to the right side of the road and stop until it passes","Stop in your lane","Pull to the left"], a:1, e:"Yield the right-of-way by pulling to the right side of the road and stopping until the vehicle has passed."},
 {c:"Right of way", q:"You may not follow within how many feet of a fire vehicle responding to an alarm (unless on official business)?", o:["100 feet","200 feet","500 feet","1,000 feet"], a:2, e:"Do not follow within 500 feet of a fire vehicle responding to an alarm."},
 {c:"Right of way", q:"A school bus on a two-lane road has its red lights flashing. You must:", o:["Slow down and pass carefully","Stop. Traffic in both directions must stop","Stop only if you are behind the bus","Pass on the right"], a:1, e:"On a two-lane road, traffic in both directions must stop until the red lights stop flashing."},
 {c:"Right of way", q:"A school bus is stopped with red lights flashing on a divided highway (four or more lanes) with a median. Who must stop?", o:["Traffic in both directions","Only traffic behind the bus","Only traffic in the opposite direction","No one"], a:1, e:"With a median, only vehicles behind the bus must stop. The same applies on a road with five or more lanes and a shared center turn lane. Slow down near buses anyway."},
 {c:"Right of way", q:"What does Utah's Move Over law ask when you approach a stationary vehicle with its hazard lights flashing beside the road?", o:["Honk twice","Slow down, give as much space as practical, and if safe move to a lane not next to it","Speed up to pass quickly","Stop behind it"], a:1, e:"Reduce your speed and give as much space as practical. If it is safe, change to a lane not adjacent to the stationary vehicle."},
 {c:"Right of way", q:"On a narrow mountain road, if you are going downhill and meet a car coming uphill, you must:", o:["Go first, because gravity helps you","Yield to the vehicle going uphill","Honk and speed up","Stop in the middle"], a:1, e:"You must yield to vehicles going uphill if you are traveling downhill on a narrow road."},
 {c:"Right of way", q:"Trains have the right-of-way over which vehicles?", o:["Only cars","Cars but not ambulances","Cars, police, fire engines, and ambulances alike","None of them"], a:2, e:"Trains have the right-of-way 100% of the time, over ambulances, fire engines, cars, and police."},

 // ----- Speed and safe driving (Handbook Sections 6-9, 11, 12) -----
 {c:"Speed and safe driving", q:"With no sign posted, what is the speed limit while children are going to or leaving school, or when school zone lights are flashing?", o:["15 mph","20 mph","25 mph","30 mph"], a:1, e:"The limit is 20 mph passing a school during recess, when children are going to or leaving school, or when flashing lights are operating."},
 {c:"Speed and safe driving", q:"Unless a sign says otherwise, the speed limit in a business or residential area is:", o:["20 mph","25 mph","35 mph","45 mph"], a:1, e:"It is 25 mph in any business or residential area."},
 {c:"Speed and safe driving", q:"The handbook says to use what rule to keep a safe following distance?", o:["One-second rule","Two-second rule","Five-car-length rule","Whatever feels comfortable"], a:1, e:"Use the two-second rule and add more time in bad weather or poor visibility."},
 {c:"Speed and safe driving", q:"At night you should increase your following distance by at least:", o:["One second","Two seconds","Five seconds","It does not change at night"], a:1, e:"At night, add at least two seconds to your following distance."},
 {c:"Speed and safe driving", q:"Which is the number one cause of crashes on Utah highways?", o:["Following too closely","Texting","Speeding in work zones","Running red lights"], a:0, e:"Following too closely is the leading cause of crashes, followed by failing to yield right-of-way."},
 {c:"Speed and safe driving", q:"Which activity is against the law for a driver of a moving car in Utah?", o:["Using voice commands for GPS","Manually typing or reading a text message","Listening to the radio","Using a hands-free voice call (drivers over 18)"], a:1, e:"Manually writing, sending, or reading a text, email, or other written message on a handheld device is prohibited."},
 {c:"Speed and safe driving", q:"A driver under 18 may use a handheld wireless device while driving only to:", o:["Talk to friends","Communicate with a parent or guardian, report a hazard or crime, or in a medical emergency","Read texts at red lights","Check social media at stop signs"], a:1, e:"Under 18, use is limited to a medical emergency, reporting a safety hazard or crime, or communicating with a parent or legal guardian."},
 {c:"Speed and safe driving", q:"Who must wear a seat belt or be in a proper child seat in the vehicle?", o:["Only the driver","Driver and front passenger","Everyone in the vehicle","Anyone under 18"], a:2, e:"Everyone in your vehicle must have a fastened safety belt or child seat."},
 {c:"Speed and safe driving", q:"In Utah, children aged 8 and under must ride in an approved child safety seat unless they are at least how tall?", o:["48 inches","52 inches","57 inches","60 inches"], a:2, e:"Children aged eight and under must be secured in a child seat unless they are 57 inches tall."},
 {c:"Speed and safe driving", q:"How long should you signal before a turn or lane change?", o:["Not at all for short moves","One second","At least two seconds","Five seconds"], a:2, e:"Signal for two seconds before turning and before any lane change."},
 {c:"Speed and safe driving", q:"Before changing lanes you should:", o:["Only check the mirrors","Check mirrors, signal at least two seconds, and look over your shoulder to check your blind spot","Signal and move quickly","Tap the horn"], a:1, e:"Mirrors do not show everything. Do a head check over your shoulder in the direction you will move."},
 {c:"Speed and safe driving", q:"When backing up, you should:", o:["Use only your mirrors","Look through the rear window, with your right arm on the back of the passenger seat","Back quickly to save time","Back up on the freeway if needed"], a:1, e:"Mirrors do not show the area right behind your vehicle. Look through the rear window and back slowly. Never back up on a freeway."},
 {c:"Speed and safe driving", q:"Where should your hands be on the steering wheel?", o:["Both hands on the outside of the wheel","One hand on top, one in your lap","Both hands inside the wheel spokes","Wherever is comfortable"], a:0, e:"Keep both hands on the outside of the steering wheel at all times, unless using other controls."},
 {c:"Speed and safe driving", q:"Which place should you NOT pass another vehicle?", o:["On a straight road with a broken line","Where a curve or hill blocks your view","On a multi-lane road with space on the left","On a clear road"], a:1, e:"Never pass where a curve or hill blocks your view, at intersections, before a railroad crossing or bridge, or in a no-passing zone."},
 {c:"Speed and safe driving", q:"On the freeway, a driver in the left lane who is approached from behind should:", o:["Speed up","Move safely to the right to avoid impeding traffic","Brake","Stay put, because the left lane is theirs"], a:1, e:"A vehicle in the left lane must move safely to the right when approached from behind. You can be cited for impeding traffic."},
 {c:"Speed and safe driving", q:"You miss your freeway exit. What should you do?", o:["Back up on the shoulder","Use the next exit. Never back up or use an entrance ramp to exit","Make a U-turn","Cross the median"], a:1, e:"It is illegal to use an entrance ramp to exit, to make a U-turn on the freeway, or to back up on a freeway."},
 {c:"Speed and safe driving", q:"Your car starts to skid on a slippery road. What should you do?", o:["Slam on the brakes","Slowly take your foot off the gas and steer in the direction the rear is skidding","Accelerate","Turn sharply the opposite way"], a:1, e:"Slow down gradually. Do not slam the brakes. Steer in the direction the rear is skidding, and straighten the wheels once you regain traction."},
 {c:"Speed and safe driving", q:"Hydroplaning can start at speeds over about:", o:["15 mph","25 mph","35 mph","65 mph"], a:2, e:"A car may start to hydroplane at speeds over 35 mph, when the front tires ride on water instead of the road."},
 {c:"Speed and safe driving", q:"Which road surface is hard to see and looks like a wet spot?", o:["Black ice","Gravel","Painted lines","Concrete"], a:0, e:"Black ice appears more like a wet spot than a patch of ice."},
 {c:"Speed and safe driving", q:"You see a flooded road ahead. What should you do?", o:["Drive through slowly","Turn around and find another route","Follow the car in front","Speed through quickly"], a:1, e:"Do not drive through flooded areas. Water can hide dips or washed-out road, and two feet of moving water can carry away most vehicles."},
 {c:"Speed and safe driving", q:"What should you do if you feel drowsy while driving?", o:["Open the window and keep going","Stop, pull off at an exit or rest area, and take a 20-minute nap","Turn up the radio","Drive faster to arrive sooner"], a:1, e:"If you start to feel tired, stop driving and take a short nap or find a place to sleep. Do not drive when tired."},
 {c:"Speed and safe driving", q:"A deer is standing at the side of the road ahead. You should:", o:["Swerve hard around it","Slow down, stay in your lane, and keep control. Do not swerve","Honk and speed up","Stop in the road"], a:1, e:"Do not swerve to avoid an animal. Your risk of injury may be greater. Keep your vehicle under control and in the travel lane."},
 {c:"Speed and safe driving", q:"A bee flies into your car and you are distracted. What does the handbook advise?", o:["Swat at it while driving","Pull over to the side of the road and take care of the problem","Close your eyes","Speed up"], a:1, e:"If a distraction happens, immediately pull over to the side of the roadway and deal with it."},
 {c:"Speed and safe driving", q:"If a vehicle is speeding out of control because of a stuck gas pedal, you should:", o:["Turn off the engine at once","Shift to neutral, look for a safe place, and brake gently","Pump the gas","Jump out"], a:1, e:"Shift to neutral, steer smoothly, brake gently, and pull off the road."},
 {c:"Speed and safe driving", q:"If a front tire blows out while driving, you should:", o:["Slam on the brakes","Grip the wheel firmly, steer straight, ease off the gas, and slow gradually","Turn sharply toward the blown tire","Speed up"], a:1, e:"Do not slam the brakes. Steer straight, take your foot off the gas, and let the vehicle slow down."},
 {c:"Speed and safe driving", q:"Your brakes stop working while driving. What do you do first?", o:["Turn off the engine","Slowly apply the parking brake","Jump the curb","Shift to park"], a:1, e:"Use the parking brake. Apply it slowly to avoid locking the rear wheels, and be ready to release it if you skid."},
 {c:"Speed and safe driving", q:"Your wheels drop off the edge of the paved road. You should:", o:["Jerk the wheel back onto the road","Slow down gradually and then turn back onto the roadway","Brake hard","Speed up"], a:1, e:"Do not panic. Slow down gradually and then turn back onto the road."},
 {c:"Speed and safe driving", q:"In a work zone you should:", o:["Speed up to leave quickly","Slow down, increase your following distance, and be ready to stop","Tailgate to keep up","Ignore the signs if no workers are visible"], a:1, e:"Slow down even if no workers are there. Fines for speeding in a work zone are at least doubled."},
 {c:"Speed and safe driving", q:"In a congested merge area (like a construction zone) the handbook says to use the:", o:["Banana method","Zipper method","Exchange method","Skip method"], a:1, e:"With the zipper method, use both lanes until the merge point, then alternate."},

 // ----- Lights and parking (Handbook Sections 8, 11, 15) -----
 {c:"Lights and parking", q:"You must dim your high beams for oncoming traffic before you get within:", o:["100 feet","200 feet","500 feet","1,000 feet"], a:2, e:"Dim your lights before you get within 500 feet of an oncoming car. When following another car, dim them within 300 feet."},
 {c:"Lights and parking", q:"When following another vehicle at night, dim your high beams when you are within:", o:["50 feet","100 feet","300 feet","1,000 feet"], a:2, e:"If you are following a car, dim your lights when you are within 300 feet of the vehicle ahead."},
 {c:"Lights and parking", q:"When must you use your headlights?", o:["Only after it is fully dark","From sunset to sunrise, and any time you cannot see persons and vehicles 1,000 feet ahead","Only in the rain","Only on highways"], a:1, e:"Use headlights from sunset to sunrise, and any time conditions keep you from seeing 1,000 feet ahead."},
 {c:"Lights and parking", q:"In fog, rain, or snow, which lights should you use?", o:["High beams","Low beams","Fog lamps only","No lights"], a:1, e:"Use your low beams to avoid glare in fog, rain, or snow."},
 {c:"Lights and parking", q:"You may not park within how many feet of a fire hydrant?", o:["5 feet","10 feet","15 feet","30 feet"], a:2, e:"Stay at least 15 feet away from a fire hydrant."},
 {c:"Lights and parking", q:"You may not park on or within how many feet of a crosswalk?", o:["5 feet","10 feet","20 feet","50 feet"], a:2, e:"Do not park on a crosswalk or within 20 feet of one."},
 {c:"Lights and parking", q:"You may not park closer than how many feet to a railroad crossing (unless signs allow it)?", o:["15 feet","30 feet","50 feet","100 feet"], a:2, e:"Do not park within 50 feet of the nearest rail of a railroad crossing."},
 {c:"Lights and parking", q:"When parked next to a curb, how close must your rear wheel be to the curb?", o:["No more than 12 inches","No more than 3 feet","No more than 5 feet","Distance does not matter"], a:0, e:"The back wheel of your car must be no further than 12 inches from the curb."},
 {c:"Lights and parking", q:"You park facing uphill next to a curb. You should turn your front wheels:", o:["Toward the curb","Away from the curb","Straight ahead","It does not matter"], a:1, e:"Uphill with a curb, turn the wheel away from the curb. Downhill, turn it toward the curb. Set the parking brake either way."},
 {c:"Lights and parking", q:"Red or blue lights visible from the front of a vehicle may be used by:", o:["Any driver at night","Emergency, school, snow removal, or other authorized vehicles","Only taxis","Anyone who has them installed"], a:1, e:"Red or blue lights visible from the front are only for emergency, school, snow removal, or other authorized vehicles."},

 // ----- Sharing the road (Handbook Section 14) -----
 {c:"Sharing the road", q:"When passing a bicyclist, Utah law requires you to keep at least how much space?", o:["1 foot","2 feet","3 feet","6 feet"], a:2, e:"Utah law requires a minimum of three feet from any bicyclist or vulnerable user you are passing."},
 {c:"Sharing the road", q:"When you approach a bicyclist, you should:", o:["Honk loudly close to them","Slow down, give as much space as possible, and avoid sounding the horn close to them","Pass as fast as you can","Move to within a foot of them"], a:1, e:"A horn can startle bicyclists and cause them to steer into your path. Slow down and give them space."},
 {c:"Sharing the road", q:"Before opening your door after parking on the street, you should:", o:["Open it quickly","Check to the sides and rear for bicyclists","Honk","Do nothing special"], a:1, e:"Check for bicyclists before opening your door."},
 {c:"Sharing the road", q:"If you can't see a truck driver's face in the truck's side mirror:", o:["They can still see you","They cannot see you","They are asleep","The mirror is broken"], a:1, e:"If you can't see the truck driver in their side mirror, they can't see you."},
 {c:"Sharing the road", q:"How far behind a large truck can its rear blind spot (no-zone) extend?", o:["Up to 20 feet","Up to 50 feet","Up to 100 feet","Up to 200 feet"], a:3, e:"Large vehicles have huge blind spots up to 200 feet behind. Up to 20 feet in front of the cab is also a blind spot."},
 {c:"Sharing the road", q:"When passing a large truck you should:", o:["Pass on the right and linger beside it","Pass completely and on the left side, without lingering","Cut in right in front of it","Stay in its blind spot"], a:1, e:"Always pass a tractor-trailer completely and on the left side. Do not cut in front of a truck."},
 {c:"Sharing the road", q:"When sharing the road with a motorcycle, you should:", o:["Share the lane","Give it an entire lane, and stay at least two seconds behind","Flash your lights","Assume its turn signal means it will turn"], a:1, e:"Give motorcycles an entire lane. Many motorcycle turn signals don't self-cancel, so don't assume a flashing signal means a turn."},
 {c:"Sharing the road", q:"A fluorescent orange and red triangle on the back of a vehicle means:", o:["The vehicle is moving less than 25 mph","The vehicle is an emergency vehicle","Do not pass","The vehicle is carrying a wide load"], a:0, e:"The slow-moving vehicle triangle means the vehicle travels less than 25 mph. Use caution and be sure it is safe before you pass."},
 {c:"Sharing the road", q:"Near horses or horse-drawn vehicles you should:", o:["Honk to warn them","Pass with care and not use your horn or rev your engine","Speed past","Flash your lights"], a:1, e:"Noise can scare a horse and cause a crash."},
 {c:"Sharing the road", q:"When a police officer pulls you over, you should:", o:["Keep driving until a safe place","Move to the right, put the car in park, turn off the engine, and keep your hands on the wheel","Get out and walk to the officer","Hand over documents before the car stops"], a:1, e:"Pull to the right, park, turn off the engine, stay in the car unless told otherwise, and keep your hands on the steering wheel."},
 {c:"Sharing the road", q:"How far from the nearest rail must you stop at a railroad crossing?", o:["Less than 5 feet","Between 15 and 50 feet","Between 50 and 100 feet","Right at the tracks"], a:1, e:"You must be between 15 and 50 feet from the nearest rail."},
 {c:"Sharing the road", q:"The lights at a railroad crossing are flashing. You must:", o:["Cross quickly","Come to a complete stop and not proceed while the lights are flashing","Drive around the gate","Slow down and look"], a:1, e:"You may not proceed while the lights are flashing. Never go around gates or barriers."},
 {c:"Sharing the road", q:"Your car stalls on a railroad crossing. You should:", o:["Stay in the car and call a friend","Get everyone out immediately and move off the tracks","Try to push it first, no matter what","Lock the doors"], a:1, e:"Get everyone out of the car and off the tracks right away, and notify authorities. If a train is coming, move away from the tracks."},
 {c:"Sharing the road", q:"A pedestrian is crossing ahead and is on your half of the road. You must:", o:["Honk","Stop and stay stopped until they have crossed at least your half of the road","Go around them","Speed up"], a:1, e:"You must remain stopped until the pedestrian has crossed at least your half of the road."},

 // ----- Crashes and emergencies (Handbook Section 12) -----
 {c:"Crashes and emergencies", q:"You are in a crash. What must you do first?", o:["Leave quickly","Stop immediately","Call a friend first","Move far away from the scene"], a:1, e:"Stop immediately. Leaving the scene of a crash can mean suspension or revocation and even jail."},
 {c:"Crashes and emergencies", q:"You must notify law enforcement (911) if a crash causes injury, death, or at least how much property damage?", o:["$100","$500","$2,500","$10,000"], a:2, e:"If the crash results in injuries, death, or at least $2,500 in total property damage, you must notify law enforcement immediately."},
 {c:"Crashes and emergencies", q:"If your vehicle breaks down, how far behind it should you place flares or triangles?", o:["10 to 20 feet","50 to 100 feet","200 to 300 feet","1,000 feet"], a:2, e:"Place flares or triangles 200 to 300 feet behind your vehicle to give other drivers time to change lanes or slow down."},
 {c:"Crashes and emergencies", q:"Your vehicle breaks down on the road. What should you do?", o:["Stay in the lane with no lights","Get off the roadway, turn on your hazard lights, raise the hood, and call for help","Stand in front of the car","Leave the vehicle in the middle of the road"], a:1, e:"Get your vehicle off the roadway and make it visible with flashers and a raised hood."},
 {c:"Crashes and emergencies", q:"Your vehicle goes into water and begins to sink. What do you do first?", o:["Wait for help","Remove your safety belt and get out right away","Call 911 first","Open the trunk"], a:1, e:"A vehicle floats only 30 to 60 seconds. First remove your safety belt, then lower the window and climb out."},
 {c:"Crashes and emergencies", q:"If you are stranded in a snowstorm, the handbook says to:", o:["Walk to find help","Stay with your vehicle and turn on your hazard lights","Leave the car and run","Sleep with the engine on and windows sealed"], a:1, e:"Stay with your vehicle. Most deaths in these situations occur when people leave their vehicles. Keep the exhaust pipe clear and leave a window open for fresh air."},
 {c:"Crashes and emergencies", q:"Drivers wearing safety belts are:", o:["Less able to control the car","More in control in emergencies and more likely to avoid a crash","The same as unbelted drivers","Safer only at high speeds"], a:1, e:"Belts keep you in your seat and help you keep control. A safety belt should be worn at any speed."},
 {c:"Crashes and emergencies", q:"What does the point system do?", o:["Gives points for safe driving","Assigns points for violations, and drivers under 21 reaching 70 points in three years are asked to attend a hearing","Charges money for each point","Only applies to commercial drivers"], a:1, e:"Points are assigned for violations. Under 21 you are asked to appear for a hearing at 70 or more points in three years."}
];

// ---------- State ----------
var KEY = "utahPermitPrep.v1";
var COUNTS = [10,20,30,50,0]; // 0 = all questions
var store = {best:0, missed:[], taken:0, count:10};
try { var s = localStorage.getItem(KEY); if (s) { var p = JSON.parse(s); store.best = p.best||0; store.missed = p.missed||[]; store.taken = p.taken||0; if (COUNTS.indexOf(p.count) !== -1) store.count = p.count; } } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

var app = document.getElementById("app");
var run = null; // {items:[{id,order}], i, right:[], wrong:[], answered:false, label}

function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function cats(){ var m={}; Q.forEach(function(x){ m[x.c]=(m[x.c]||0)+1; }); return m; }

// ---------- Screens ----------
function home(){
  run = null;
  var missedN = store.missed.length;
  var html = '<div class="sign"><h1>Utah Permit Prep</h1><p>Practice questions for the learner permit knowledge test.</p>' +
    (store.taken ? '<div class="best">Best score: ' + store.best + '%</div>' : '') + '</div>';
  html += '<div class="lbl">How many questions?</div><div class="chips">';
  COUNTS.forEach(function(n){
    html += '<button class="chip" data-n="' + n + '" aria-pressed="' + (store.count===n) + '" onclick="setCount(' + n + ')">' + (n===0 ? 'All' : n) + '</button>';
  });
  html += '</div><p class="hint">The real test has 50 questions. Pick 50 to match it.</p>';
  html += '<button class="btn primary" onclick="start(\'random\')"><span class="t">Start quiz</span><span class="s" id="startsub">' + Math.min(store.count || Q.length, Q.length) + ' random questions, 80% to pass</span></button>';
  if (missedN) html += '<button class="btn" onclick="start(\'missed\')"><span class="t">Drill my missed questions</span><span class="s">' + missedN + ' to review</span></button>';
  html += '<h2>By topic</h2>';
  var c = cats();
  Object.keys(c).forEach(function(k){
    html += '<button class="btn" data-cat="' + esc(k) + '" onclick="start(\'cat\', this.dataset.cat)"><span class="t">' + esc(k) + '</span><span class="s">' + c[k] + ' questions</span></button>';
  });
  var standalone = window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) html += '<p class="note"><b>Install it:</b> tap the Share button, then Add to Home Screen. It will open like an app and work without internet.</p>';
  html += '<p class="note">This is a practice tool, not the official test. Read the official Utah Driver Handbook from the Driver License Division (dld.utah.gov) and check it for the latest rules.</p>';
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function setCount(n){
  store.count = n; save();
  document.querySelectorAll(".chip").forEach(function(b){ b.setAttribute("aria-pressed", String(+b.dataset.n === n)); });
  var s = document.getElementById("startsub"); if (s) s.textContent = Math.min(n || Q.length, Q.length) + " random questions, 80% to pass";
}

function start(mode, cat){
  var ids = Q.map(function(_,i){return i;});
  var label = "Quiz";
  var n = store.count || Q.length;
  if (mode === "random"){ ids = shuffle(ids).slice(0,n); label = "Quiz"; }
  else if (mode === "missed"){ ids = shuffle(store.missed.filter(function(i){return i<Q.length;})).slice(0,n); label = "Missed questions"; }
  else if (mode === "cat"){ ids = shuffle(ids.filter(function(i){return Q[i].c===cat;})).slice(0,n); label = cat; }
  if (!ids.length){ home(); return; }
  run = {items: ids.map(function(id){ return {id:id, order:shuffle([0,1,2,3])}; }), i:0, right:[], wrong:[], answered:false, label:label, mode:mode};
  question();
}

function question(){
  var it = run.items[run.i], q = Q[it.id], total = run.items.length;
  var html = '<div class="topbar"><span>Question ' + (run.i+1) + ' of ' + total + '</span><button class="quit" onclick="home()">Quit</button></div>';
  html += '<div class="bar"><i style="width:' + (run.i/total*100) + '%"></i></div>';
  html += '<div class="cat">' + esc(q.c) + '</div><h2 class="q">' + esc(q.q) + '</h2>';
  it.order.forEach(function(oi, pos){
    html += '<button class="btn opt" data-oi="' + oi + '" onclick="answer(' + oi + ')"><span class="l">' + "ABCD"[pos] + '</span><span>' + esc(q.o[oi]) + '</span></button>';
  });
  html += '<div id="fb"></div>';
  run.answered = false;
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function answer(oi){
  if (run.answered) return;
  run.answered = true;
  var it = run.items[run.i], q = Q[it.id], ok = (oi === q.a);
  (ok ? run.right : run.wrong).push(it.id);
  var btns = app.querySelectorAll(".opt");
  btns.forEach(function(b){
    var v = +b.dataset.oi; b.disabled = true;
    if (v === q.a) b.classList.add("right");
    else if (v === oi) b.classList.add("wrong");
  });
  var last = run.i === run.items.length - 1;
  document.getElementById("fb").innerHTML =
    '<div class="explain ' + (ok?'yes':'no') + '"><b>' + (ok ? 'Correct' : 'Not quite') + '</b>' + esc(q.e) + '</div>' +
    '<button class="btn primary center" onclick="next()"><span class="t">' + (last ? 'See results' : 'Next question') + '</span></button>';
  var nb = document.querySelector("#fb .btn"); if (nb) nb.scrollIntoView({block:"nearest", behavior:"smooth"});
}

function next(){
  if (run.i < run.items.length - 1){ run.i++; question(); } else { results(); }
}

function results(){
  var total = run.items.length, n = run.right.length, pct = Math.round(n/total*100), pass = pct >= 80;
  // update missed list: add new misses, clear ones answered right
  var set = {}; store.missed.forEach(function(i){ set[i]=1; });
  run.wrong.forEach(function(i){ set[i]=1; });
  run.right.forEach(function(i){ delete set[i]; });
  store.missed = Object.keys(set).map(Number);
  store.taken++; if (run.mode !== "missed" && pct > store.best) store.best = pct;
  save();

  var html = '<div class="sign"><h1>' + esc(run.label) + ' complete</h1></div>';
  html += '<div class="center"><div class="score">' + pct + '%</div><div>' + n + ' of ' + total + ' correct</div>' +
          '<div class="verdict ' + (pass?'pass':'fail') + '">' + (pass ? 'Passing score (80% or more)' : 'Below the 80% passing mark') + '</div></div>';
  if (run.wrong.length){
    html += '<h2>Review what you missed</h2>';
    run.wrong.forEach(function(id){
      var q = Q[id];
      html += '<div class="miss"><div class="mq">' + esc(q.q) + '</div><div class="ma">Answer: ' + esc(q.o[q.a]) + '</div><div class="me">' + esc(q.e) + '</div></div>';
    });
  } else {
    html += '<p class="center">No misses. Nice work.</p>';
  }
  html += '<button class="btn primary" onclick="start(\'' + (run.mode==="cat" ? 'cat\', ' + JSON.stringify(run.label).replace(/"/g,"&quot;") : run.mode + '\'') + ')"><span class="t">Try again</span></button>';
  if (store.missed.length && run.mode !== "missed") html += '<button class="btn" onclick="start(\'missed\')"><span class="t">Drill my missed questions</span><span class="s">' + store.missed.length + ' to review</span></button>';
  html += '<button class="btn" onclick="home()"><span class="t">Back to start</span></button>';
  app.innerHTML = html;
  window.scrollTo(0,0);
}

home();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
